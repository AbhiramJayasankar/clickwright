# DeepSeek V4.1 Flash, free route on Token Harbor (works without a plan).
model = "deepseek-v4.1-flash:free"
coords = "auto"          # filled in by `calibrate`; falls back to pixels
output = "tool_calls"
max_tokens = 6000        # it thinks a lot; 600 was not enough for one screenshot
notes = "Free route; Token Harbor does not say whether it serves the 1017 snapshot."
max_request_mb = 3.8      # Token Harbor free accounts reject requests over 4 MB
