[project]
name = "pixel-agent"
version = "0.1.0"
description = "Model-agnostic computer-use agent for Windows that acts with pixel coordinates"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
uia = ["comtypes>=1.4"]   # UI Automation hints and the password-box check

[project.scripts]
pixel-agent = "pixel_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pixel_agent", "pixel_agent.win"]
